<select
  [class]="variant"
  [attr.aria-label]="ariaLabel || null"
  [ngModel]="value"
  (ngModelChange)="onHandleChange($event)">
  @if (placeholder) {
    <option [ngValue]="''">{{ placeholder }}</option>
  }
  @for (option of options; track option.valor) {
    <option [ngValue]="option.valor">{{ option.texto }}</option>
  }
</select>
