<div class="search-bar-hero" role="search">

  <label class="field destination">
    <select
      aria-label="Ciudad"
      [(ngModel)]="ciudad"
      (ngModelChange)="onCampoChange()"
      (keydown.enter)="onSearchClick()">
      <option value="">Todas las ciudades</option>
      @for (c of ciudades; track c) {
        <option [value]="c">{{ c }}</option>
      }
    </select>
  </label>

  <div class="divider"></div>

  <div class="field dates">
    <input
      type="date"
      aria-label="Fecha de llegada"
      [(ngModel)]="llegada"
      [attr.min]="hoy"
      (ngModelChange)="onLlegadaChange()"
      (click)="$any($event.target).showPicker?.()"
      (keydown.enter)="onSearchClick()">

    <span class="dot" aria-hidden="true">•</span>

    <input
      type="date"
      aria-label="Fecha de salida"
      [(ngModel)]="salida"
      [attr.min]="llegada || hoy"
      (ngModelChange)="onCampoChange()"
      (click)="$any($event.target).showPicker?.()"
      (keydown.enter)="onSearchClick()">
  </div>

  <div class="divider"></div>

  <label class="field guests">
    <select
      aria-label="Número de huéspedes"
      [(ngModel)]="huespedes"
      (ngModelChange)="onCampoChange()"
      (keydown.enter)="onSearchClick()">
      @for (n of opcionesHuespedes; track n) {
        <option [ngValue]="n">{{ n }} {{ n === 1 ? 'huésped' : 'huéspedes' }}</option>
      }
    </select>
  </label>

  <button class="search-button" type="button" (click)="onSearchClick()">
    Buscar
  </button>

</div>

@if (error) {
  <p class="error" role="alert">{{ error }}</p>
}
