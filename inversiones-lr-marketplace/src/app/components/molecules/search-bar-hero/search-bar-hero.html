<div class="search-bar-hero">

  <!-- Destino -->
  <div class="field destination">
    <app-input
      placeholder="Añade una ciudad, hotel, dirección o lugar..."
      [value]="destination"
      (valueChange)="onDestinationChange($event)">
    </app-input>
  </div>

  <div class="divider"></div>

  <!-- Fechas: entrada • salida -->
  <div class="field dates">
    <app-input
      class="date-input"
      type="date"
      [value]="checkIn"
      (click)="$any($event.target).showPicker?.()"
      (valueChange)="onCheckInChange($event)">
    </app-input>

    <span class="dot" aria-hidden="true">•</span>

    <app-input
      class="date-input"
      type="date"
      [value]="checkOut"
      (click)="$any($event.target).showPicker?.()"
      (valueChange)="onCheckOutChange($event)">
    </app-input>
  </div>

  <div class="divider"></div>

  <!-- Huéspedes (estático por ahora) -->
  <div class="field guests">
    <span class="guests-text">2 huéspedes, 1 habitación</span>
  </div>

  <!-- Botón Buscar -->
  <button class="search-button" type="button" (click)="onSearchClick()">
    Buscar
  </button>

</div>
