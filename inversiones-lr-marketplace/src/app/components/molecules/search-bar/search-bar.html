<div class="search-bar" role="search">

  <label class="field ciudad">
    <app-icon-component name="place" size="18px" color="#899199"></app-icon-component>
    <app-select
      variant="plain"
      ariaLabel="Ciudad"
      placeholder="Todas las ciudades"
      [options]="opcionesCiudad"
      [value]="ciudad"
      (valueChange)="onCiudadChange($event)"
      (keydown.enter)="onSearchClick()">
    </app-select>
  </label>

  <div class="divider"></div>

  <label class="field fecha">
    <app-icon-component name="calendar_today" size="18px" color="#899199"></app-icon-component>
    <app-input
      type="date"
      ariaLabel="Fecha de llegada"
      [min]="hoy"
      [value]="llegada"
      (valueChange)="onLlegadaChange($event)"
      (click)="$any($event.target).showPicker?.()"
      (keydown.enter)="onSearchClick()">
    </app-input>
  </label>

  <div class="divider"></div>

  <label class="field fecha">
    <app-icon-component name="event" size="18px" color="#899199"></app-icon-component>
    <app-input
      type="date"
      ariaLabel="Fecha de salida"
      [min]="llegada || hoy"
      [value]="salida"
      (valueChange)="onSalidaChange($event)"
      (click)="$any($event.target).showPicker?.()"
      (keydown.enter)="onSearchClick()">
    </app-input>
  </label>

  <div class="divider"></div>

  <label class="field huespedes">
    <app-icon-component name="person" size="18px" color="#899199"></app-icon-component>
    <app-select
      variant="plain"
      ariaLabel="Número de huéspedes"
      [options]="opcionesHuespedes"
      [value]="huespedes"
      (valueChange)="onHuespedesChange($event)"
      (keydown.enter)="onSearchClick()">
    </app-select>
  </label>

  <button class="search-button" type="button" aria-label="Buscar alojamientos" (click)="onSearchClick()">
    <app-icon-component name="search" size="22px" color="#ffffff"></app-icon-component>
  </button>
</div>

@if (error) {
  <p class="error" role="alert">{{ error }}</p>
}
