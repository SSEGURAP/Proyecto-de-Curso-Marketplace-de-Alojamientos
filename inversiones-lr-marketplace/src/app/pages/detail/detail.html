<section class="detail">
  @if (cargando) {
    <p class="mensaje">Cargando alojamiento...</p>
  } @else if (error) {
    <div class="mensaje">
      <app-label [text]="error" variant="heading"></app-label>
      <app-button label="Volver al catálogo" variant="outline" (clicked)="volver()"></app-button>
    </div>
  } @else if (alojamiento) {

    @if (mensajeExito) {
      <div class="exito" role="status">
        <app-icon-component name="check_circle" size="24px" color="#1B7F3B"></app-icon-component>
        <span class="exito-texto">{{ mensajeExito }}</span>
        <app-button label="Ver mis reservas" variant="accent" (clicked)="irAReservas()"></app-button>
      </div>
    }

    <button type="button" class="volver" (click)="volver()">
      <app-icon-component name="arrow_back" size="18px"></app-icon-component>
      Volver al catálogo
    </button>

    <header class="encabezado">
      <h1 class="titulo">{{ alojamiento.nombre }}</h1>
      <div class="meta">
        <span class="meta-item">
          <app-icon-component name="star" size="18px" color="#FEBB02"></app-icon-component>
          <strong>{{ alojamiento.calificacion }}</strong>
          <button type="button" class="enlace" (click)="irAResenas()">
            {{ resenas.length }} {{ resenas.length === 1 ? 'reseña' : 'reseñas' }}
          </button>
        </span>
        <span class="meta-item">
          <app-icon-component name="place" size="18px"></app-icon-component>
          {{ getUbicacion(alojamiento) }}
        </span>
      </div>
    </header>

    <app-detail-gallery
      [imagenes]="imagenes"
      [alt]="alojamiento.nombre"
      (abrirFoto)="abrirVisor($event)">
    </app-detail-gallery>

    <div class="contenido">
      <div class="principal">
        <app-detail-info [alojamiento]="alojamiento"></app-detail-info>
        <app-review-list [resenas]="resenas" [calificacion]="alojamiento.calificacion"></app-review-list>
      </div>

      <app-booking-card
        [precioNoche]="alojamiento.precioNoche"
        [hoy]="hoy"
        [fechaLlegada]="fechaLlegada"
        [fechaSalida]="fechaSalida"
        [numeroHuespedes]="numeroHuespedes"
        [opcionesHuespedes]="opcionesHuespedes"
        [nombreHuesped]="nombreHuesped"
        [correoHuesped]="correoHuesped"
        [cotizacion]="cotizacion"
        [errorFormulario]="errorFormulario"
        [confirmando]="confirmando"
        (fechaLlegadaChange)="onLlegadaChange($event)"
        (fechaSalidaChange)="onSalidaChange($event)"
        (numeroHuespedesChange)="onHuespedesChange($event)"
        (nombreHuespedChange)="onNombreChange($event)"
        (correoHuespedChange)="onCorreoChange($event)"
        (iniciarReserva)="iniciarReserva()"
        (confirmarReserva)="reservar()"
        (cancelarReserva)="cancelarReserva()">
      </app-booking-card>
    </div>

    @if (visorAbierto) {
      <app-photo-viewer
        [imagenes]="imagenes"
        [indice]="visorIndice"
        [alt]="alojamiento.nombre"
        (cerrar)="cerrarVisor()">
      </app-photo-viewer>
    }
  }
</section>
